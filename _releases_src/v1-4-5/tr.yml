# 英・韓・中の訳。Claude が書く（川口さんは直さない）。
# src は訳したときの日本語。原稿の日本語が変わった文は build が TODO に戻す。
# アプリの用語は konami_score_app/lib/l10n/app_*.arb に合わせる。
src:
  title: GITADORAの同期不具合修正・公開Tier表の検索機能など
  sections:
  - heading: GITADORA
    items:
    - title: 同期で記録が公式とずれる不具合を修正
      desc: 同期後の記録が公式サイトと一致しないことがある不具合を修正しました。
      list:
      - '**更新後の最初の同期では、全曲の記録を読み直します。** 初回のみ通常より時間がかかります'
      - 記録が下がる場合は、変更前の記録を端末に残します
      - 問題の解決に時間がかかっており恐縮ですが、もう少しだけお時間をいただけますと幸いです
  - heading: Tier表
    items:
    - title: みんなが公開したTier表を探す
      desc: ほかの人が作ったカスタムTier表を、人気順（取り込んだ人数）や新着順で探せるようにしました。
      list:
      - 取り込む前にTier表の内容を確認できます
      - 自分のTier表も、公開設定を「公開」にすると一覧に載ります
  - heading: 成長の目標
    items:
    - title: 難易度で絞り込む
      desc: 成長の目標を、難易度ごとに絞り込めるようにしました。
  - heading: 設定・同期
    items:
    - title: 2台の端末を後から連携
      desc: 別々に使い始めた2台の端末も、後から連携できるようにしました。
    - title: プレー環境・同期画面
      desc: 設定の「プレー環境」と同期画面を、機種の一覧から選ぶ形に変更しました。
  - heading: 軽微な改善と修正
    items:
    - title: 改善と修正
      list:
      - '[POPN] 同じ色のメダルでも、段階が上がった場合は成果に表示するようにしました'
      - '[IIDX] クラシックハイスピードを、アーケードで選べる値に合わせました'
      - フレンドの公式IDを、公式サイトのライバル追加欄にそのまま貼れる形でコピーできるようにしました
      - その他、細かな改善と不具合を修正しました
en:
  title: GITADORA sync fix, search for public Tier lists, and more
  sections:
  - heading: GITADORA
    items:
    - title: Fixed records drifting from the official site in sync
      desc: Fixed an issue where records after a sync could differ from the official site.
      list:
      - '**The first sync after updating re-reads the records of all songs.** Only this first sync takes longer than usual'
      - When a record would go down, the previous record is kept on your device
      - We're sorry this is taking a while to resolve, and thank you for bearing with us a little longer
  - heading: Tier List
    items:
    - title: Browse Tier lists shared by others
      desc: You can now browse custom Tier lists made by others, sorted by popularity (number of imports) or newest first.
      list:
      - You can check what a Tier list contains before importing it
      - Your own Tier lists appear in the list too when you set them to "Public"
  - heading: Growth goals
    items:
    - title: Filter by difficulty
      desc: You can now filter growth goals by difficulty.
  - heading: Settings and sync
    items:
    - title: Link two devices later
      desc: Two devices you started using separately can now be linked later.
    - title: Play setup and sync screens
      desc: The "Play setup" settings and the sync screen now let you choose from a list of games.
  - heading: Minor improvements and fixes
    items:
    - title: Improvements and fixes
      list:
      - '[pop''n] Medal progress within the same color now shows up in your results'
      - '[IIDX] Classic hi-speed values now match the values selectable in the arcade'
      - Friends' official IDs are now copied in a form you can paste straight into the rival search on the official site
      - Other minor improvements and bug fixes
ko:
  title: GITADORA 동기화 문제 수정, 공개 Tier 표 검색 기능 등
  sections:
  - heading: GITADORA
    items:
    - title: 동기화 시 기록이 공식과 어긋나는 문제 수정
      desc: 동기화 후 기록이 공식 사이트와 일치하지 않는 경우가 있던 문제를 수정했습니다.
      list:
      - '**업데이트 후 첫 동기화에서는 모든 곡의 기록을 다시 읽어 옵니다.** 첫 동기화만 평소보다 시간이 걸립니다'
      - 기록이 내려가는 경우에는 변경 전 기록을 기기에 남깁니다
      - 문제 해결에 시간이 걸려 죄송합니다. 조금만 더 기다려 주시면 감사하겠습니다
  - heading: Tier 표
    items:
    - title: 다른 사람이 공개한 Tier 표 찾기
      desc: 다른 사람이 만든 커스텀 Tier 표를 인기순(가져온 사람 수)과 최신순으로 찾을 수 있습니다.
      list:
      - 가져오기 전에 Tier 표의 내용을 확인할 수 있습니다
      - 내 Tier 표도 공개 설정을 "공개"로 하면 목록에 표시됩니다
  - heading: 성장 목표
    items:
    - title: 난이도로 좁혀 보기
      desc: 성장 목표를 난이도별로 좁혀 볼 수 있습니다.
  - heading: 설정·동기화
    items:
    - title: 두 기기를 나중에 연동
      desc: 따로 쓰기 시작한 두 기기도 나중에 연동할 수 있습니다.
    - title: 플레이 환경·동기화 화면
      desc: 설정의 "플레이 환경"과 동기화 화면을 기종 목록에서 고르는 방식으로 바꿨습니다.
  - heading: 소소한 개선과 수정
    items:
    - title: 개선과 수정
      list:
      - '[pop''n] 같은 색의 메달이라도 단계가 올라가면 성과에 표시합니다'
      - '[IIDX] 클래식 하이스피드를 아케이드에서 고를 수 있는 값에 맞췄습니다'
      - 친구의 공식 ID를 공식 사이트의 라이벌 추가 검색란에 그대로 붙여 넣을 수 있는 형태로 복사합니다
      - 그 밖의 세세한 개선과 문제 수정
zh:
  title: GITADORA 同步問題修正、搜尋公開的 Tier 表等
  sections:
  - heading: GITADORA
    items:
    - title: 修正同步後紀錄與官方不符的問題
      desc: 修正了同步後紀錄有時與官方網站不一致的問題。
      list:
      - '**更新後的第一次同步會重新讀取所有歌曲的紀錄。** 僅第一次會比平常花更多時間'
      - 紀錄將會下降時，會在裝置上保留變更前的紀錄
      - 問題的解決花了不少時間，非常抱歉，還請再給我們一點時間
  - heading: Tier表
    items:
    - title: 尋找大家公開的 Tier 表
      desc: 現在可以依熱門程度（匯入人數）或最新順序，尋找其他人製作的自訂 Tier 表。
      list:
      - 匯入前可以先確認 Tier 表的內容
      - 自己的 Tier 表在公開設定選擇「公開」後，也會出現在列表中
  - heading: 成長目標
    items:
    - title: 依難度篩選
      desc: 成長目標現在可以依難度篩選。
  - heading: 設定・同步
    items:
    - title: 之後再連結兩台裝置
      desc: 分別開始使用的兩台裝置，現在也能之後再連結。
    - title: 遊玩環境・同步畫面
      desc: 設定中的「遊玩環境」與同步畫面，改為從機種列表中選擇。
  - heading: 小幅改善與修正
    items:
    - title: 改善與修正
      list:
      - '[pop''n] 即使是同色的獎牌，階段提升時也會顯示在成果中'
      - '[IIDX] 經典高速設定改為與機台可選的數值一致'
      - 複製好友的官方 ID 時，改為可以直接貼到官方網站好友對手搜尋欄的格式
      - 其他細微改善與問題修正
